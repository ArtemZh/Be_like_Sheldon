<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Where can I get in a day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <aside id="panel">
      <div class="title-row">
        <h1 data-i18n="app.title">Where can I get in a day</h1>
        <button type="button" id="intro-open" data-i18n-title="intro.open" data-i18n-aria="intro.open">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M6 6a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9v.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="8" cy="11.6" r="0.8" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div id="window-switch" role="radiogroup" data-i18n-aria="window.legend">
        <button type="button" data-window="day" aria-checked="true" role="radio">
          <span data-i18n="window.day">Day</span><small data-i18n="window.day.range">Mon 09:00 → 23:00</small>
        </button>
        <button type="button" data-window="night" aria-checked="false" role="radio">
          <span data-i18n="window.night">Overnight</span><small data-i18n="window.night.range">Mon 09:00 → Tue 09:00</small>
        </button>
      </div>

      <label for="origin" data-i18n="field.from">From</label>
      <select id="origin"></select>

      <label for="min-stay"><span data-i18n="field.minStay">Minimum on site</span> · <output id="min-stay-value"></output></label>
      <input id="min-stay" type="range" min="0" max="43200" step="1800" value="14400" />

      <label for="overhead"><span data-i18n="field.overhead">Coffee and a hotdog</span> · <output id="overhead-value"></output></label>
      <input id="overhead" type="range" min="0" max="7200" step="900" value="3600" />

      <label class="toggle"><input id="show-zones" type="checkbox" checked /> <span data-i18n="field.zones">Show zones</span></label>

      <p id="status"></p>

      <div id="legend">
        <h2 data-i18n="legend.title">Useful hours on site</h2>
        <ul>
          <li><span class="dot" style="background: #e8763a"></span><span class="label"></span></li>
          <li><span class="dot" style="background: #d4500f"></span><span class="label"></span></li>
          <li><span class="dot" style="background: #a83a0b"></span><span class="label"></span></li>
          <li><span class="dot" style="background: #5e1f06"></span><span class="label"></span></li>
        </ul>
      </div>

      <div id="lang-switch" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="de">DE</button>
        <button type="button" data-lang="pl">PL</button>
        <button type="button" data-lang="uk">UK</button>
      </div>
    </aside>
    <div id="map"></div>

    <!-- Шкала часу: один прохід показує обидва напрямки — станції
         зʼявляються, коли туди можна доїхати, і гаснуть, коли останній
         потяг назад уже пішов. -->
    <div id="timeline" hidden>
      <button type="button" id="timeline-play" data-i18n-aria="timeline.play">
        <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M5 3.5v9l8-4.5z" fill="currentColor" />
        </svg>
        <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true" hidden>
          <path d="M5 3.5h2.2v9H5zM8.8 3.5H11v9H8.8z" fill="currentColor" />
        </svg>
      </button>

      <div id="timeline-track">
        <svg id="timeline-profile" viewBox="0 0 600 34" preserveAspectRatio="none" aria-hidden="true">
          <path id="timeline-area" d="" />
        </svg>
        <div id="timeline-ticks"></div>
        <input id="timeline-range" type="range" min="0" max="1000" value="0" step="1" />
        <div id="timeline-head"><span id="timeline-clock">09:00</span></div>
      </div>

      <p id="timeline-count"></p>
    </div>

    <!-- Вступне вікно: показується один раз, далі відкривається з панелі. -->
    <div id="intro-backdrop" hidden></div>
    <div id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden>
      <img
        class="intro-photo"
        src="intro.webp"
        data-i18n-alt="photo.alt" alt=""
        hidden
      />

      <h2 id="intro-title" data-i18n="intro.title">You don’t have to work on Monday</h2>

      <p data-i18n="intro.p1"></p>
      <p data-i18n="intro.p2"></p>
      <p data-i18n="intro.p3"></p>

      <button type="button" id="intro-close" data-i18n="intro.close">Pick a city</button>
    </div>


    <!-- Підказка живе окремим вікном, а не попапом на марці: попап
         перехоплював би клік, а клік по станції задає новий старт.
         Вікно не зникає — коли нема чого показати, воно просто порожнє,
         щоб не смикалось на кожному русі миші. Його можна перетягнути. -->
    <div id="hint" class="is-empty">
      <p class="hint-name"></p>
      <p class="hint-useful"></p>
      <p class="hint-times"></p>
      <p class="hint-placeholder" data-i18n="hint.placeholder">Hover a station</p>
    </div>
    <script type="module" src="/src/map.js"></script>
  </body>
</html>
